name: Android build & preview release

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build APK and unsigned AAB
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease --stacktrace
      - name: Verify build outputs
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          unzip -t app/build/outputs/apk/debug/app-debug.apk > /dev/null
          unzip -Z -1 app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/skypeep-apk-files.txt"
          for screen in splash menu map pause over skins; do
            grep -Fxq "assets/screen_$screen.jpg" "$RUNNER_TEMP/skypeep-apk-files.txt" || exit 1
          done
          for i in 1 2 3 4 5 6; do
            for asset in "bg_$i.jpg" "pillar_${i}_top.png" "pillar_${i}_bottom.png" \
                         "hud_left_$i.png" "hud_score_$i.png" \
                         "hud_right_$i.png" "hud_pause_$i.png"; do
              grep -Fxq "assets/$asset" "$RUNNER_TEMP/skypeep-apk-files.txt" \
                || { echo "MISSING APK ASSET: $asset"; exit 1; }
            done
          done
          for asset in bird_idle.png bird_up.png bird_down.png coin_asset.png gem_asset.png \
                       ui_36.fnt ui_62.fnt music.ogg flap.wav coin.wav win.wav fail.wav click.wav; do
            grep -Fxq "assets/$asset" "$RUNNER_TEMP/skypeep-apk-files.txt" \
              || { echo "MISSING APK ASSET: $asset"; exit 1; }
          done
          unzip -t app/build/outputs/bundle/release/app-release.aab > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: SkyPeep-Android-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Publish GitHub preview release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/skypeep-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v0.2.4-preview.${GITHUB_RUN_NUMBER}"
          gh release create "$VERSION" \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/bundle/release/app-release.aab \
            --target "$GITHUB_SHA" \
            --title "SkyPeep $VERSION" \
            --prerelease \
            --notes 'Android preview featuring all six original 2D worlds, dynamic world and menu texture loading, corrected gate-width collisions, and safe background pause. Debug APK is for testing. The AAB is UNSIGNED and cannot be uploaded to Google Play without app signing. Visual and device smoke testing is still required.'