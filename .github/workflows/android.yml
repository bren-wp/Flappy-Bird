name: Android build & preview release

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build APK and unsigned AAB
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease --stacktrace
      - name: Verify build outputs
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          unzip -t app/build/outputs/apk/debug/app-debug.apk > /dev/null
          unzip -Z -1 app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/skypeep-apk-files.txt"
          for screen in splash menu map pause over skins; do
            grep -Fxq "assets/screen_$screen.jpg" "$RUNNER_TEMP/skypeep-apk-files.txt" || exit 1
          done
          # Pixel rebuilt world JPGs must be produced and packaged for EVERY world.
          # The reconstruction task fails the build if image decoding fails.
          for i in 1 2 3 4 5 6; do
            test -s "app/build/generated/skypeep-assets/bg_$i.jpg" \
              || { echo "Missing reconstructed world $i"; exit 1; }
          done
          for i in 1 2 3 4 5 6; do
            for asset in "bg_$i.jpg" "pillar_${i}_top.png" "pillar_${i}_bottom.png" \
                         "hud_left_$i.png" "hud_score_$i.png" \
                         "hud_right_$i.png" "hud_pause_$i.png"; do
              grep -Fxq "assets/$asset" "$RUNNER_TEMP/skypeep-apk-files.txt" \
                || { echo "MISSING APK ASSET: $asset"; exit 1; }
            done
          done
          for asset in bird_idle.png bird_up.png bird_down.png coin_asset.png gem_asset.png \
                       ui_36.fnt ui_62.fnt music.ogg flap.wav coin.wav win.wav fail.wav click.wav; do
            grep -Fxq "assets/$asset" "$RUNNER_TEMP/skypeep-apk-files.txt" \
              || { echo "MISSING APK ASSET: $asset"; exit 1; }
          done
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            grep -Fxq "lib/$abi/libgdx.so" "$RUNNER_TEMP/skypeep-apk-files.txt" \
              || { echo "FATAL: missing libgdx.so for $abi"; exit 1; }
          done
          unzip -t app/build/outputs/bundle/release/app-release.aab > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: SkyPeep-Android-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
  emulator-smoke:
    name: Boot and launch Android app
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify runner Android SDK
        run: test -d "$ANDROID_HOME/platforms" && echo "Android SDK available"
      - uses: actions/download-artifact@v4
        with:
          name: SkyPeep-Android-${{ github.run_number }}
          path: smoke-artifacts
      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Android emulator startup smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect
          script: bash .github/scripts/android-emulator-smoke.sh
      - name: Upload emulator logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SkyPeep-Emulator-Smoke-${{ github.run_number }}
          path: smoke-results/
          if-no-files-found: warn

      - name: Publish GitHub release after emulator smoke
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/skypeep-v0.3.3-hud-counters'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v0.3.3-preview.${GITHUB_RUN_NUMBER}"
          APK="$(find smoke-artifacts -type f -name 'app-debug.apk' -print -quit)"
          AAB="$(find smoke-artifacts -type f -name 'app-release.aab' -print -quit)"
          test -n "$APK" && test -n "$AAB"
          gh release create "$VERSION" \
            "$APK" \
            "$AAB" \
            --target "$GITHUB_SHA" \
            --title "SkyPeep $VERSION" \
            --prerelease \
            --notes 'SkyPeep HUD cleanup: preserve all six authentic illustrated coin and gem plates, replace baked-in 63/4 with dynamic counters and compact large-value formatting, check Android screenshots and full existing smoke. Debug APK is for testing. The AAB is UNSIGNED and cannot be uploaded to Google Play without app signing. Visual and device smoke testing is still required.'
