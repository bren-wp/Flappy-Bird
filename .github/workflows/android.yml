name: Android build & preview release

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build APK and unsigned AAB
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease --stacktrace
      - name: Verify build outputs
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          unzip -t app/build/outputs/apk/debug/app-debug.apk > /dev/null
          unzip -Z -1 app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/skypeep-apk-files.txt"
          for screen in splash menu map pause over skins; do
            grep -Fxq "assets/screen_$screen.jpg" "$RUNNER_TEMP/skypeep-apk-files.txt" || exit 1
          done
          for i in 1 2 3 4 5 6; do
            for asset in "bg_$i.jpg" "pillar_${i}_top.png" "pillar_${i}_bottom.png" \
                         "hud_left_$i.png" "hud_score_$i.png" \
                         "hud_right_$i.png" "hud_pause_$i.png"; do
              grep -Fxq "assets/$asset" "$RUNNER_TEMP/skypeep-apk-files.txt" \
                || { echo "MISSING APK ASSET: $asset"; exit 1; }
            done
          done
          for asset in bird_idle.png bird_up.png bird_down.png coin_asset.png gem_asset.png \
                       ui_36.fnt ui_62.fnt music.ogg flap.wav coin.wav win.wav fail.wav click.wav; do
            grep -Fxq "assets/$asset" "$RUNNER_TEMP/skypeep-apk-files.txt" \
              || { echo "MISSING APK ASSET: $asset"; exit 1; }
          done
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            grep -Fxq "lib/$abi/libgdx.so" "$RUNNER_TEMP/skypeep-apk-files.txt" \
              || { echo "FATAL: missing libgdx.so for $abi"; exit 1; }
          done
          unzip -t app/build/outputs/bundle/release/app-release.aab > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: SkyPeep-Android-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
  emulator-smoke:
    name: Boot and launch Android app
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify runner Android SDK
        run: test -d "$ANDROID_HOME/platforms" && echo "Android SDK available"
      - uses: actions/download-artifact@v4
        with:
          name: SkyPeep-Android-${{ github.run_number }}
          path: smoke-artifacts
      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Android emulator startup smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -e
            mkdir -p smoke-results
            adb logcat -c
            adb install -r smoke-artifacts/app-debug.apk
            adb shell am start -W -n com.brendigo.skypeep/.MainActivity
            sleep 12
            adb logcat -d -v time > smoke-results/logcat.txt
            adb shell dumpsys activity activities > smoke-results/activities.txt
            adb exec-out screencap -p > smoke-results/startup.png || true
            if ! adb shell pidof com.brendigo.skypeep; then
              echo 'FAIL: SkyPeep process died during launch'
              grep -A 70 -B 12 -E 'FATAL EXCEPTION|AndroidRuntime|com.brendigo.skypeep|libgdx' smoke-results/logcat.txt | tail -200 || true
              exit 1
            fi
            adb shell input tap 540 1490
            sleep 3
            if ! adb shell pidof com.brendigo.skypeep; then
              echo 'FAIL: SkyPeep crashed navigating from splash'
              exit 1
            fi
            adb exec-out screencap -p > smoke-results/menu.png || true
            echo 'PASS: SkyPeep launched and survived initial navigation'
      - name: Upload emulator logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SkyPeep-Emulator-Smoke-${{ github.run_number }}
          path: smoke-results/
          if-no-files-found: warn

      - name: Publish GitHub release after emulator smoke
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/skypeep-startup-v0.2.5'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v0.2.5-preview.${GITHUB_RUN_NUMBER}"
          gh release create "$VERSION" \
            smoke-artifacts/app-debug.apk \
            smoke-artifacts/app-release.aab \
            --target "$GITHUB_SHA" \
            --title "SkyPeep $VERSION" \
            --prerelease \
            --notes 'Android startup hotfix: native libgdx.so explicitly packaged for ARM and x86, with emulated startup testing and crash diagnostics. Debug APK is for testing. The AAB is UNSIGNED and cannot be uploaded to Google Play without app signing. Visual and device smoke testing is still required.'
