name: Android build & preview release

on:
  push:
    branches: [main, 'feature/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only validate the newest pushed commit of a branch; outdated emulator
# executions must not consume CI capacity or publish stale preview builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Audit unused Kotlin/Java code
        run: python3 tools/dead_code_audit.py
      - name: Build APK and unsigned AAB
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease --stacktrace
      - name: Verify offline and local-only Android manifest
        run: |
          grep -q 'android:allowBackup="false"' app/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' app/AndroidManifest.xml
          if grep -Eq 'android.permission.(INTERNET|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|READ_CONTACTS|READ_SMS)' app/AndroidManifest.xml; then
            echo "Unexpected sensitive Android permission"; exit 1
          fi
      - name: Validate effective merged Android permissions (debug and release)
        run: |
          # Dependencies and build-variant manifests can introduce permissions
          # that do not exist in the project's source AndroidManifest.xml.
          set -euo pipefail
          root="app/build/intermediates/merged_manifests"
          test -d "$root" || { echo "FAIL: merged manifests not generated"; exit 1; }
          for variant in debug release; do
            merged="$(find "$root" -type f -path "*/$variant/*" -name AndroidManifest.xml -print -quit)"
            test -s "$merged" || { echo "FAIL: missing merged $variant manifest"; exit 1; }
            grep -q 'android:allowBackup="false"' "$merged" || {
              echo "FAIL: backups enabled in merged $variant manifest"; exit 1;
            }
            grep -q 'android:usesCleartextTraffic="false"' "$merged" || {
              echo "FAIL: cleartext enabled in merged $variant manifest"; exit 1;
            }
            if grep -Eq 'android.permission.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|ACCESS_BACKGROUND_LOCATION|READ_CONTACTS|READ_SMS|RECORD_AUDIO|CAMERA|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE)' "$merged"; then
              echo "FAIL: forbidden permission in merged $variant manifest"
              grep -E 'android.permission.' "$merged" || true
              exit 1
            fi
            echo "PASS: $variant merged manifest remains offline and local-only"
          done
      - name: Verify build outputs
        run: |
          # Guard against a release tag advertising the wrong packaged version.
          grep -Eq "versionCode[[:space:]]+24" app/build.gradle
          grep -Fq "versionName '0.3.12'" app/build.gradle
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          unzip -t app/build/outputs/apk/debug/app-debug.apk > /dev/null
          unzip -Z -1 app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/skypeep-apk-files.txt"
          for screen in splash menu map pause over skins; do
            grep -Fxq "assets/screen_$screen.jpg" "$RUNNER_TEMP/skypeep-apk-files.txt" || exit 1
          done
          # Pixel rebuilt world JPGs must be produced and packaged for EVERY world.
          # The reconstruction task fails the build if image decoding fails.
          for i in 1 2 3 4 5 6; do
            test -s "app/build/generated/skypeep-assets/bg_$i.jpg" \
              || { echo "Missing reconstructed world $i"; exit 1; }
          done
          for i in 1 2 3 4 5 6; do
            for asset in "bg_$i.jpg" "pillar_${i}_top.png" "pillar_${i}_bottom.png" \
                         "hud_left_$i.png" "hud_score_$i.png" \
                         "hud_right_$i.png" "hud_pause_$i.png"; do
              grep -Fxq "assets/$asset" "$RUNNER_TEMP/skypeep-apk-files.txt" \
                || { echo "MISSING APK ASSET: $asset"; exit 1; }
            done
          done
          for asset in bird_idle.png bird_up.png bird_down.png coin_asset.png gem_asset.png \
                       ui_36.fnt ui_62.fnt music.ogg flap.wav coin.wav win.wav fail.wav click.wav; do
            grep -Fxq "assets/$asset" "$RUNNER_TEMP/skypeep-apk-files.txt" \
              || { echo "MISSING APK ASSET: $asset"; exit 1; }
          done
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            grep -Fxq "lib/$abi/libgdx.so" "$RUNNER_TEMP/skypeep-apk-files.txt" \
              || { echo "FATAL: missing libgdx.so for $abi"; exit 1; }
          done
          unzip -t app/build/outputs/bundle/release/app-release.aab > /dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SkyPeep-Dead-Code-Audit-${{ github.run_number }}
          path: smoke-results/dead-code-audit.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: SkyPeep-Android-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
  emulator-smoke:
    name: Boot and launch Android app
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify runner Android SDK
        run: test -d "$ANDROID_HOME/platforms" && echo "Android SDK available"
      - uses: actions/download-artifact@v4
        with:
          name: SkyPeep-Android-${{ github.run_number }}
          path: smoke-artifacts
      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Android emulator startup smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect
          script: bash .github/scripts/android-emulator-smoke.sh
      - name: Upload emulator logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SkyPeep-Emulator-Smoke-${{ github.run_number }}
          path: smoke-results/
          if-no-files-found: warn

  # Build/test jobs always have READ-ONLY repository permissions. Only a
  # successful, trusted-branch push obtains an elevated token to publish.
  release:
    name: Publish verified preview
    needs: [android, emulator-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/skypeep-v0.3.12-artwork-preservation'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SkyPeep-Android-${{ github.run_number }}
          path: release-artifacts
      - name: Publish APK and unsigned AAB after successful QA
        env:
          # Optional fine-grained Contents:write PAT for repositories where
          # GITHUB_TOKEN cannot create Releases (HTTP 403). No secret is logged.
          GH_TOKEN: ${{ secrets.SKYPEEP_RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The branch may have moved while this emulator job was running.
          current_head="$(gh api "repos/$GH_REPO/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')"
          if [[ "$current_head" != "$GITHUB_SHA" ]]; then
            echo "Skipping stale preview at $GITHUB_SHA; branch head is $current_head"
            exit 0
          fi
          VERSION="v0.3.12-preview.${GITHUB_RUN_NUMBER}"
          APK="$(find release-artifacts -type f -name 'app-debug.apk' -print -quit)"
          AAB="$(find release-artifacts -type f -name 'app-release.aab' -print -quit)"
          test -s "$APK" && test -s "$AAB"
          # Keep the release PRIVATE while uploading files; a later push
          # could supersede this run even after the first head check.
          gh release create "$VERSION" \
            "$APK" "$AAB" \
            --target "$GITHUB_SHA" \
            --title "SkyPeep $VERSION" \
            --draft --prerelease \
            --notes '0.3.12: preserve original illustrated floating islands, clouds and mountain scenery in Sky Start/Cloud Pass using precision removal of baked-in HUD/bird/pillars/coins instead of overwide erasure masks. Maintain the original bird source aspect ratio and scalable skin overlay. Add original-midground retention guards and visual QA. Unit, art restoration, APK/AAB and emulator smoke required. APK debug installable; AAB UNSIGNED and not Play-ready. Full 1:1 parity for remaining worlds not yet certified.'
          # A stale draft is never published; delete it and its temporary tag.
          publish_head="$(gh api "repos/$GH_REPO/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')"
          if [[ "$publish_head" != "$GITHUB_SHA" ]]; then
            echo "Deleting superseded draft $VERSION ($GITHUB_SHA => $publish_head)"
            gh release delete "$VERSION" --yes --cleanup-tag
            exit 0
          fi
          gh release edit "$VERSION" --draft=false
