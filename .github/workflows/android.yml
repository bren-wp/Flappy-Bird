name: Android build & preview release

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build APK and unsigned AAB
        run: gradle :app:assembleDebug :app:bundleRelease --stacktrace
      - name: Verify build outputs
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          unzip -t app/build/outputs/apk/debug/app-debug.apk > /dev/null
          unzip -t app/build/outputs/bundle/release/app-release.aab > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: SkyPeep-Android-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Publish GitHub preview release
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/skypeep-android-foundation'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v0.2.0-preview.${GITHUB_RUN_NUMBER}"
          gh release create "$VERSION" \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/bundle/release/app-release.aab \
            --target "$GITHUB_SHA" \
            --title "SkyPeep $VERSION" \
            --prerelease \
            --notes 'Android preview of SkyPeep with original 2D visual assets, six level themes and game screens. Debug APK is for testing. The AAB is UNSIGNED and cannot be uploaded to Google Play without app signing. Visual and device smoke testing is still required.'